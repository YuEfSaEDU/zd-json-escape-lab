name: fuzz

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: false
      - name: Clone upstream gem
        run: git clone --depth 1 https://github.com/zendesk/activesupport_json_escape.git upstream
      - name: Install deps
        run: |
          cd upstream
          bundle config set frozen false
          bundle install
      - name: Compile extension
        run: |
          cd upstream
          bundle exec rake compile
      - name: Run differential fuzzer
        run: |
          cd upstream
          cp ../fuzz.rb .
          bundle exec ruby fuzz.rb
